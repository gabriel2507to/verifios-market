<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se Busca - VerifiOS Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased py-10 px-4 min-h-screen flex flex-col justify-center items-center">

    <div class="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-200">
        
        <!-- Encabezado con Logotipo Propio -->
        <div class="text-center mb-6 flex flex-col items-center">
            <img src="img/logomarket3.png" alt="VerifiOS Market Logo" class="w-24 h-24 object-contain mb-3 rounded-2xl shadow-sm">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">¿Qué buscas o necesitas? 🔍</h1>
            <p class="text-xs text-slate-500 mt-1">Sube la foto de lo que quieres mandar a hacer o encontrar en Cuenca y escribe tu duda.</p>
        </div>

        <form id="userSearchForm" class="space-y-4">
            
            <!-- 1. Lo que busca la gente (Directo y libre) -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">¿Qué buscas o quién te hace esto?</label>
                <textarea id="nombre" rows="3" placeholder="Ej: ¿Alguien que me fabrique una repisa igual a esta o sabe dónde la venden?" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
            </div>

            <!-- 2. WhatsApp -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Tu WhatsApp para que te escriban</label>
                <input type="text" id="whatsapp" placeholder="0987654321" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <!-- 3. La foto obligatoria -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Foto de referencia (Sube 1 imagen)</label>
                <input type="file" id="imagen_file" accept="image/png, image/jpeg, image/webp" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-3.5 rounded-xl font-bold text-sm transition shadow-md shadow-amber-500/20">
                🚀 Publicar en "Se Busca"
            </button>
            
            <div id="status"></div>
        </form>

        <div class="mt-4 text-center">
            <a href="index.html" class="inline-block w-full py-2 px-4 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                Regresar a VerifiOS Market.
            </a>
        </div>
    </div>
        
    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6 px-4 text-center text-slate-500 text-xs w-full">
        <p class="font-medium text-slate-500">VerifiOS Market • Cuenca, Ecuador</p>
    </footer>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWvzgjOEx4y3NuSXtJOpIhFZ0uD1kMu3M",
            authDomain: "verifios-market.firebaseapp.com",
            projectId: "verifios-market",
            storageBucket: "verifios-market.firebasestorage.app",
            messagingSenderId: "830441055062",
            appId: "1:830441055062:web:eb7780ab47d65691bc6cf7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const convertirImagenABase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        document.getElementById('userSearchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            let rawWsp = document.getElementById('whatsapp').value.trim();
            const archivoInput = document.getElementById('imagen_file').files[0];

            if (rawWsp.startsWith('0')) {
                rawWsp = '593' + rawWsp.substring(1);
            } else if (!rawWsp.startsWith('593')) {
                rawWsp = '593' + rawWsp;
            }

            if (!archivoInput) {
                status.textContent = "❌ Debes seleccionar una foto.";
                status.className = "mt-4 text-center text-xs font-semibold text-red-600";
                return;
            }

            status.textContent = "Subiendo solicitud...";
            status.className = "mt-4 text-center text-xs font-semibold text-amber-600";

            try {
                const imagenBase64 = await convertirImagenABase64(archivoInput);

                // Se guarda directo en tu misma base de datos con tipo "solicitud"
                await db.collection('productos').add({
                    tipo: "solicitud",
                    nombre: document.getElementById('nombre').value,
                    estado: "🔍 Se Busca / Comunidad",
                    descripcion: "",
                    precio: 0,
                    local_id: "particular_" + rawWsp,
                    whatsapp: rawWsp,
                    imagen_url: imagenBase64,
                    fecha_creacion: firebase.firestore.FieldValue.serverTimestamp(),
                    activo: true
                });

                status.textContent = "🎉 ¡Listo! Tu foto y pregunta ya saldrán en la comunidad.";
                status.className = "mt-4 text-center text-xs font-semibold text-emerald-600";
                document.getElementById('userSearchForm').reset();

            } catch (error) {
                status.textContent = "❌ Error: " + error.message;
                status.className = "mt-4 text-center text-xs font-semibold text-red-600";
            }
        });
    </script>
</body>
</html>
