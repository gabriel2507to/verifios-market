<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - VerifiOS Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-6 min-h-screen flex items-center justify-center">

    <!-- Contenedor Principal Amplio -->
    <div class="max-w-4xl w-full bg-white p-6 rounded-xl shadow-md">
        
        <!-- Pantalla de Login (Se muestra si NO hay sesión activa) -->
        <div id="loginSection" class="hidden max-w-xl mx-auto">
            <div class="text-center mb-4 flex flex-col items-center">
                <img src="img/logomarket3.png" alt="VerifiOS Market Logo" class="w-32 h-32 object-contain mb-2 rounded-xl">
            </div>
            <h1 class="text-2xl font-bold mb-2 text-gray-800 text-center">Acceso Administrativo</h1>
            <p class="text-xs text-gray-500 text-center mb-6">Ingresa tus credenciales para gestionar la vitrina.</p>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="loginEmail" required class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="loginPassword" required class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white p-2 rounded-lg font-bold hover:bg-slate-800 transition">Entrar al Panel</button>
            </form>
            <p id="loginStatus" class="mt-4 text-center text-sm font-semibold"></p>
        </div>

        <!-- Panel de Administración (Oculto hasta que inicies sesión) -->
        <div id="adminSection" class="hidden space-y-8">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center space-x-2">
                    <img src="img/logomarket3.png" alt="Logo" class="w-10 h-10 object-contain rounded-lg">
                    <span class="font-bold text-gray-800 text-lg">Panel Admin • VerifiOS Market</span>
                </div>
                <button id="btnLogout" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1.5 rounded-lg font-semibold transition">Cerrar Sesión</button>
            </div>

         <!-- Formulario y Tabla divididos en grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- Columna 1: Formulario de Publicación / Edición -->
    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 id="form-titulo" class="text-base font-bold text-slate-800 mb-3">➕ Nueva Publicación</h2>
        <form id="productForm" class="space-y-3 text-sm">
            <input type="hidden" id="edit-id" value="">
            
            <div>
                <label class="block font-medium text-gray-700">Tipo de Publicación</label>
                <select id="tipo" class="w-full mt-1 p-2 border rounded-lg bg-white focus:ring focus:ring-blue-300">
                    <option value="producto">📦 Producto</option>
                    <option value="servicio">🛠️ Servicio</option>
                    <option value="busqueda">🔍 Lo que alguien busca</option>
                </select>
            </div>

            <div>
                <label class="block font-medium text-gray-700">Título / Nombre del Item</label>
                <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <!-- Estado del artículo o Modalidad -->
            <div>
                <label id="label-estado" class="block font-medium text-gray-700">Estado del artículo</label>
                <select id="estado" class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300 bg-white">
                    <option value="✨ Nuevo (En caja / Sin uso)">✨ Nuevo (En caja / Sin uso)</option>
                    <option value="💎 Seminuevo (Poco uso / Excelente estado)">💎 Seminuevo (Poco uso / Excelente estado)</option>
                    <option value="🔄 Usado (Funcional / Detalles normales)">🔄 Usado (Funcional / Detalles normales)</option>
                </select>
            </div>

            <!-- Descripción o detalles breves -->
            <div>
                <label class="block font-medium text-gray-700">Descripción o detalles breves</label>
                <textarea id="descripcion" rows="2" placeholder="Ej: Incluye cargador original, poco tiempo de uso..." class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300 resize-none"></textarea>
            </div>

            <div>
                <label id="label-precio" class="block font-medium text-gray-700">Precio / Rango ($) (Pon 0 si no aplica)</label>
                <input type="number" step="0.01" id="precio" required class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">ID del Local / Anunciante</label>
                <input type="text" id="local_id" required placeholder="Ej: local_crispin" class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label class="block font-medium text-gray-700">WhatsApp (Ej: 0987654321)</label>
                <input type="text" id="whatsapp" required placeholder="09..." class="w-full mt-1 p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            
            <!-- Sección de Imagen con Selector de Modo (Archivo o URL) -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="font-medium text-gray-700">Fotografía del Artículo</label>
                    <div class="space-x-1 text-[11px]">
                        <button type="button" onclick="cambiarModoImagen('archivo')" id="btn-tab-archivo" class="px-2 py-0.5 rounded bg-blue-600 text-white font-semibold transition">📂 Subir Archivo</button>
                        <button type="button" onclick="cambiarModoImagen('url')" id="btn-tab-url" class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-semibold transition">🌐 Usar URL</button>
                    </div>
                </div>
                
                <!-- Opción A: Archivo local -->
                <div id="contenedor-archivo">
                    <input type="file" id="imagen_file" accept="image/*" class="w-full mt-1 p-1.5 border rounded-lg bg-white text-xs file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <!-- Opción B: URL externa -->
                <div id="contenedor-url" class="hidden">
                    <input type="url" id="imagen_url_input" placeholder="https://i.ibb.co/..." class="w-full mt-1 p-2 border rounded-lg bg-white focus:ring focus:ring-blue-300 text-xs">
                </div>
            </div>

            <div class="flex gap-2 pt-1">
                <button type="submit" id="btn-publicar" class="flex-1 bg-blue-600 text-white p-2.5 rounded-lg font-bold hover:bg-blue-700 transition">Publicar en la Vitrina</button>
                <button type="button" id="btn-cancelar-edit" onclick="cancelarEdicion()" class="hidden bg-gray-300 text-gray-700 px-3 py-2.5 rounded-lg font-bold hover:bg-gray-400 transition text-xs">Cancelar</button>
            </div>
        </form>
        <p id="status" class="mt-3 text-center text-xs font-semibold"></p>
    </div>

    <!-- Columna 2: Listado y Gestión de Anuncios -->
    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col">
        <h2 class="text-base font-bold text-slate-800 mb-3">📋 Anuncios Activos en Vitrina</h2>
        <div id="lista-anuncios-admin" class="space-y-3 overflow-y-auto max-h-[460px] pr-1">
            <!-- Se cargan dinámicamente -->
            <p class="text-xs text-slate-500 text-center py-8">Cargando anuncios...</p>
        </div>
    </div>

</div>

<div class="mt-4 text-center">
    <a href="index.html" class="inline-block w-full py-2 px-4 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 transition-colors">
        Regresar a Verifios Market.
    </a>
</div>
            
    <!-- Firebase SDK Compat (App, Firestore y Auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
     const firebaseConfig = {
            apiKey: "AIzaSyAWvzgjOEx4y3NuSXtJOpIhFZ0uD1kMu3M",
            authDomain: "verifios-market.firebaseapp.com",
            projectId: "verifios-market",
            storageBucket: "verifios-market.firebasestorage.app",
            messagingSenderId: "830441055062",
            appId: "1:830441055062:web:eb7780ab47d65691bc6cf7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');
        const btnLogout = document.getElementById('btnLogout');

        let modoImagenActual = 'archivo'; // 'archivo' o 'url'
        let imagenActualEditando = ''; // Guarda la imagen previa al editar si no se selecciona otra

        function cambiarModoImagen(modo) {
            modoImagenActual = modo;
            const contArchivo = document.getElementById('contenedor-archivo');
            const contUrl = document.getElementById('contenedor-url');
            const btnArchivo = document.getElementById('btn-tab-archivo');
            const btnUrl = document.getElementById('btn-tab-url');

            if (modo === 'archivo') {
                contArchivo.classList.remove('hidden');
                contUrl.classList.add('hidden');
                btnArchivo.className = "px-2 py-0.5 rounded bg-blue-600 text-white font-semibold transition";
                btnUrl.className = "px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-semibold transition";
            } else {
                contArchivo.classList.add('hidden');
                contUrl.classList.remove('hidden');
                btnUrl.className = "px-2 py-0.5 rounded bg-blue-600 text-white font-semibold transition";
                btnArchivo.className = "px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-semibold transition";
            }
        }


// 🔄 CAMBIO DINÁMICO DE TEXTOS Y OPCIONES EN EL ADMIN SEGÚN EL TIPO
        const selectTipo = document.getElementById('tipo');
        if (selectTipo) {
            selectTipo.addEventListener('change', (e) => {
                const labelEstado = document.getElementById('label-estado'); // Asegúrate de poner este ID en el label de tu HTML de admin si gustas
                const selectEstado = document.getElementById('estado');
                const inputNombre = document.getElementById('nombre');
                const inputDesc = document.getElementById('descripcion');
                const inputPrecio = document.getElementById('precio');

                if (e.target.value === 'servicio') {
                    if (inputNombre) inputNombre.placeholder = "Ej: Asesoría Jurídica, Contabilidad...";
                    if (inputDesc) inputDesc.placeholder = "Ej: Primera consulta gratuita, previa cita...";
                    if (inputPrecio) inputPrecio.placeholder = "30.00";

                    if (selectEstado) {
                        selectEstado.innerHTML = `
                            <option value="📍 Presencial / En oficina">📍 Presencial / En oficina</option>
                            <option value="💻 100% Online / Videollamada">💻 100% Online / Videollamada</option>
                            <option value="🚗 A domicilio / A escala local">🚗 A domicilio / A escala local</option>
                            <option value="🕒 Atención 24/7 / Urgencias">🕒 Atención 24/7 / Urgencias</option>
                        `;
                    }
                } else {
                    if (inputNombre) inputNombre.placeholder = "Ej: Exprimidor Oster semi-nuevo";
                    if (inputDesc) inputDesc.placeholder = "Ej: Incluye cargador original, poco uso...";
                    if (inputPrecio) inputPrecio.placeholder = "15.00";

                    if (selectEstado) {
                        selectEstado.innerHTML = `
                            <option value="✨ Nuevo (En caja / Sin uso)">✨ Nuevo (En caja / Sin uso)</option>
                            <option value="💎 Seminuevo (Poco uso / Excelente estado)">💎 Seminuevo (Poco uso / Excelente estado)</option>
                            <option value="🔄 Usado (Funcional / Detalles normales)">🔄 Usado (Funcional / Detalles normales)</option>
                        `;
                    }
                }
            });
        }

        // Escuchar el estado de autenticación en tiempo real
        auth.onAuthStateChanged((user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                cargarAnunciosAdmin();
            } else {
                adminSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        });

        // Manejar el inicio de sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                loginForm.reset();
                loginStatus.textContent = "";
            } catch (error) {
                loginStatus.textContent = "❌ Credenciales incorrectas o acceso denegado.";
                loginStatus.className = "mt-4 text-center text-sm font-semibold text-red-600";
            }
        });

        // Manejar cierre de sesión
        btnLogout.addEventListener('click', async () => {
            await auth.signOut();
        });

        // Cargar anuncios activos para gestionarlos
        async function cargarAnunciosAdmin() {
            const contenedor = document.getElementById('lista-anuncios-admin');
            contenedor.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Actualizando lista...</p>';

            try {
                const snapshot = await db.collection('productos').where('activo', '==', true).get();
                contenedor.innerHTML = '';

                if (snapshot.empty) {
                    contenedor.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">No hay anuncios activos en este momento.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const p = doc.data();
                    const id = doc.id;
                    // Mostrar WhatsApp quitando el prefijo 593 para que se vea amigable en el admin si se desea, o normal
                    let wspMostrar = p.whatsapp ? p.whatsapp.replace('593', '') : '';
                    
                    // Asegurar valores por defecto si el documento anterior no tenía estos campos
                    const estadoVal = p.estado || '';
                    const descVal = p.descripcion || '';

                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-white p-3 rounded-lg border border-slate-200 shadow-sm flex items-center justify-between gap-3";
                    tarjeta.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img src="${p.imagen_url}" class="w-12 h-12 object-cover rounded-md flex-shrink-0" onerror="this.src='https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&q=80&w=100'">
                            <div class="truncate">
                                <p class="text-xs font-bold text-slate-800 truncate">${p.nombre}</p>
                                <p class="text-[11px] text-emerald-600 font-semibold">$${Number(p.precio).toFixed(2)} • <span class="text-slate-500 font-normal">Local: ${p.local_id}</span></p>
                            </div>
                        </div>
                        <div class="flex gap-1 flex-shrink-0">
                            <button onclick="prepararEdicion('${id}', '${p.tipo}', \`${p.nombre}\`, \`${estadoVal}\`, \`${descVal}\`, ${p.precio}, '${p.local_id}', '${wspMostrar}', '${p.imagen_url}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-semibold px-2 py-1.5 rounded-md transition border border-blue-200" title="Editar">
                                ✏️
                            </button>
                            <button onclick="eliminarAnuncio('${id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold px-2.5 py-1.5 rounded-md transition border border-red-200" title="Quitar">
                                🗑️
                            </button>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                contenedor.innerHTML = '<p class="text-xs text-red-500 text-center">Error al cargar la lista.</p>';
            }
        }

        // Cargar datos en el formulario para editar
        function prepararEdicion(id, tipo, nombre, estado, descripcion, precio, localId, whatsapp, imagenUrl) {
            document.getElementById('edit-id').value = id;
            document.getElementById('tipo').value = tipo;
            document.getElementById('nombre').value = nombre;
            if(document.getElementById('estado')) document.getElementById('estado').value = estado;
            if(document.getElementById('descripcion')) document.getElementById('descripcion').value = descripcion;
            document.getElementById('precio').value = precio;
            document.getElementById('local_id').value = localId;
            document.getElementById('whatsapp').value = whatsapp;
            
            imagenActualEditando = imagenUrl;
            cambiarModoImagen('url');
            document.getElementById('imagen_url_input').value = imagenUrl;

            document.getElementById('form-titulo').textContent = "✏️ Editando Publicación";
            document.getElementById('btn-publicar').textContent = "Guardar Cambios";
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Cancelar modo edición
        function cancelarEdicion() {
            document.getElementById('edit-id').value = "";
            document.getElementById('productForm').reset();
            imagenActualEditando = "";
            cambiarModoImagen('archivo');
            document.getElementById('form-titulo').textContent = "➕ Nueva Publicación";
            document.getElementById('btn-publicar').textContent = "Publicar en la Vitrina";
            document.getElementById('btn-cancelar-edit').classList.add('hidden');
            document.getElementById('status').textContent = "";
        }

        // Función para dar de baja un anuncio de la vitrina
        async function eliminarAnuncio(id) {
            if (confirm("¿Estás seguro de quitar este anuncio de la vitrina?")) {
                try {
                    await db.collection('productos').doc(id).update({ activo: false });
                    alert("Anuncio retirado exitosamente.");
                    cargarAnunciosAdmin();
                } catch (error) {
                    alert("Error al eliminar: " + error.message);
                }
            }
        }

        // Función auxiliar para convertir la imagen seleccionada a Base64 optimizada
        function convertirImagenABase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        // Lógica de publicación y actualización de datos
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const btnPublicar = document.getElementById('btn-publicar');
            const editId = document.getElementById('edit-id').value;
            const localId = document.getElementById('local_id').value;
            let rawWsp = document.getElementById('whatsapp').value.trim();

            // Formatear automáticamente el WhatsApp agregando 593 si empieza con 0 o no lo tiene
            if (rawWsp.startsWith('0')) {
                rawWsp = '593' + rawWsp.substring(1);
            } else if (!rawWsp.startsWith('593')) {
                rawWsp = '593' + rawWsp;
            }

            status.textContent = "⏳ Procesando y guardando...";
            status.className = "mt-3 text-center text-xs font-semibold text-blue-600";
            btnPublicar.disabled = true;

            try {
                let imagenUrlFinal = imagenActualEditando;

                if (modoImagenActual === 'archivo') {
                    const fileInput = document.getElementById('imagen_file');
                    if (fileInput.files && fileInput.files[0]) {
                        imagenUrlFinal = await convertirImagenABase64(fileInput.files[0]);
                    }
                } else {
                    const urlInputVal = document.getElementById('imagen_url_input').value.trim();
                    if (urlInputVal) {
                        imagenUrlFinal = urlInputVal;
                    }
                }

                const estadoVal = document.getElementById('estado') ? document.getElementById('estado').value : '';
                const descVal = document.getElementById('descripcion') ? document.getElementById('descripcion').value.trim() : '';

                if (editId) {
                    // MODO EDICIÓN: Actualizar el documento existente
                    await db.collection('productos').doc(editId).update({
                        tipo: document.getElementById('tipo').value,
                        nombre: document.getElementById('nombre').value,
                        estado: estadoVal,
                        descripcion: descVal,
                        precio: parseFloat(document.getElementById('precio').value),
                        local_id: localId,
                        whatsapp: rawWsp,
                        imagen_url: imagenUrlFinal
                    });

                    status.textContent = "✅ ¡Modificado con éxito!";
                    status.className = "mt-3 text-center text-xs font-semibold text-green-600";
                    cancelarEdicion();
                } else {
                    // MODO CREACIÓN: Verificar límite de 3 por local
                    const snapshot = await db.collection('productos').where('local_id', '==', localId).where('activo', '==', true).get();
                    
                    if (snapshot.size >= 3) {
                        status.textContent = "⚠️ Este local ya alcanzó el límite gratuito de 3 publicaciones.";
                        status.className = "mt-3 text-center text-xs font-semibold text-red-600";
                        btnPublicar.disabled = false;
                        return;
                    }

                    await db.collection('productos').add({
                        tipo: document.getElementById('tipo').value,
                        nombre: document.getElementById('nombre').value,
                        estado: estadoVal,
                        descripcion: descVal,
                        precio: parseFloat(document.getElementById('precio').value),
                        local_id: localId,
                        whatsapp: rawWsp,
                        imagen_url: imagenUrlFinal,
                        fecha_creacion: firebase.firestore.FieldValue.serverTimestamp(),
                        activo: true
                    });

                    status.textContent = "✅ ¡Publicado con éxito!";
                    status.className = "mt-3 text-center text-xs font-semibold text-green-600";
                    document.getElementById('productForm').reset();
                    cambiarModoImagen('archivo');
                }

                cargarAnunciosAdmin();
            } catch (error) {
                status.textContent = "❌ Error: " + error.message;
                status.className = "mt-3 text-center text-xs font-semibold text-red-600";
            } finally {
                btnPublicar.disabled = false;
            }
        });
    </script>
</body>
</html>
